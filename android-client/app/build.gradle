plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.example.remiolike.client"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.remiolike.client"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "0.2.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
