<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LCD Dashboard</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body class="dashboard-page">
    <header class="dashboard-header">
      <h1>LCD Dashboard</h1>
      <span id="dashboardStatus" class="client-status">Connecting...</span>
    </header>
    <section class="command-bar">
      <span id="commandStatus">Ready.</span>
    </section>
    <main class="device-list" id="deviceList"></main>
    <section id="editDialog" class="edit-dialog" hidden>
      <div class="edit-modal">
        <h2>Edit LCD</h2>
        <p id="editDeviceCode">LCD</p>
        <label for="editNameInput">Display name</label>
        <input id="editNameInput" type="text" maxlength="60" autocomplete="off">
        <div class="edit-actions">
          <button id="resetEditButton" class="button secondary-button">Reset</button>
          <button id="cancelEditButton" class="button secondary-button">Cancel</button>
          <button id="saveEditButton" class="button">Save</button>
        </div>
      </div>
    </section>
    <section id="viewerPanel" class="viewer-panel" hidden>
      <header class="viewer-header">
        <h2 id="viewerTitle">LCD Viewer</h2>
        <div class="viewer-actions">
          <button id="enableControlButton" class="button secondary-button">Enable Control</button>
          <button id="backButton" class="button secondary-button">Back</button>
          <button id="homeButton" class="button secondary-button">Home</button>
          <button id="recentsButton" class="button secondary-button">Recents</button>
          <button id="closeViewer" class="button secondary-button">Close</button>
        </div>
      </header>
      <div class="viewer-stage">
        <div id="viewerStatus" class="viewer-status">Waiting for screen permission...</div>
        <img id="screenImage" alt="LCD screen">
      </div>
    </section>
    <script src="/dashboard.js"></script>
  </body>
</html>
